<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 664" width="830" height="664">
  <defs>
    <style>
      .term {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13.5px;
        letter-spacing: 0px;
        white-space: pre;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window container with shadow -->
  <rect x="15" y="10" width="800" height="644" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Terminal Header / Title bar -->
  <rect x="15" y="10" width="800" height="34" rx="10" fill="#11111b" />
  <rect x="15" y="32" width="800" height="12" fill="#11111b" />

  <!-- Window controls -->
  <circle cx="36" cy="27" r="6" fill="#f38ba8" />
  <circle cx="56" cy="27" r="6" fill="#f9e2af" />
  <circle cx="76" cy="27" r="6" fill="#a6e3a1" />

  <!-- Title -->
  <text x="415.0" y="29" fill="#6c7086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">vimbyte</text>

  <!-- Terminal content -->
  <text x="30" y="64" class="term"><tspan fill="#585b70">┌──────────────────────────────────────────────────────────────────────────────┐</tspan></text>
<text x="30" y="84" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#89b4fa" font-weight="bold"> TRACK: BASICS (#1/4)</tspan>                                      <tspan fill="#a6adc8">~45s</tspan>  <tspan fill="#74c7ec" font-weight="bold">[ LEARNING ]</tspan> <tspan fill="#585b70">│</tspan></text>
<text x="30" y="104" class="term"><tspan fill="#585b70">├──────────────────────────────────────────────────────────────────────────────┤</tspan></text>
<text x="30" y="124" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#89dceb" font-weight="bold"> 01. Home Row Navigation: h, j, k, l                                          </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="144" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4" font-style="italic"> Navigate text effortlessly without moving your right hand from the home row. </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="164" class="term"><tspan fill="#585b70">├── KEYSTROKES ────────────────────────────────────────────────────────────────┤</tspan></text>
<text x="30" y="184" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#a6e3a1" font-weight="bold"> h</tspan><tspan fill="#cdd6f4">              Move cursor left                                              </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="204" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#a6e3a1" font-weight="bold"> j</tspan><tspan fill="#cdd6f4">              Move cursor down (think of arrow pointing down)               </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="224" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#a6e3a1" font-weight="bold"> k</tspan><tspan fill="#cdd6f4">              Move cursor up                                                </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="244" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#a6e3a1" font-weight="bold"> l</tspan><tspan fill="#cdd6f4">              Move cursor right                                             </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="264" class="term"><tspan fill="#585b70">├── CONCEPT ───────────────────────────────────────────────────────────────────┤</tspan></text>
<text x="30" y="284" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4"> Arrow keys require moving your hand off the touch-typing home row.           </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="304" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4"> In Vim&#x27;s Normal mode, your right fingers rest directly over h, j, k, and l.  </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="324" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">                                                                              </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="344" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   h: Left    (index finger shifts left)                                      </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="364" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   j: Down    (index finger rests here; looks like a down arrow)              </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="384" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   k: Up      (middle finger)                                                 </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="404" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   l: Right   (ring finger)                                                   </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="424" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">                                                                              </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="444" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4"> Numbers can precede any motion as a count. For example:                      </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="464" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   3j  = jump down 3 lines                                                    </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="484" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#cdd6f4">   5l  = jump right 5 characters                                              </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="504" class="term"><tspan fill="#585b70">├── DRILL INSTRUCTIONS ────────────────────────────────────────────────────────┤</tspan></text>
<text x="30" y="524" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#f9e2af"> 1. Position your cursor on &#x27;[START]&#x27;.                                        </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="544" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#f9e2af"> 2. Press &#x27;l&#x27; repeatedly (or &#x27;12l&#x27;) to reach the right end of Line 1.         </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="564" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#f9e2af"> 3. Press &#x27;j&#x27; three times to move down to Line 4.                             </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="584" class="term"><tspan fill="#585b70">│</tspan><tspan fill="#f9e2af"> 4. Press &#x27;h&#x27; repeatedly to navigate to &#x27;[GOAL REACHED]&#x27; on Line 5.           </tspan><tspan fill="#585b70">│</tspan></text>
<text x="30" y="604" class="term"><tspan fill="#585b70">└──────────────────────────────────────────────────────────────────────────────┘</tspan></text>
<text x="34" y="634" class="term"><tspan fill="#a6e3a1" font-weight="bold">[d]</tspan><tspan fill="#cdd6f4"> Drill in Vim   </tspan><tspan fill="#89dceb" font-weight="bold">[Enter]</tspan><tspan fill="#cdd6f4"> Mark Done   </tspan><tspan fill="#f9e2af" font-weight="bold">[s]</tspan><tspan fill="#cdd6f4"> Solution   </tspan><tspan fill="#89b4fa" font-weight="bold">[n]</tspan><tspan fill="#cdd6f4"> Next   </tspan><tspan fill="#cba6f7" font-weight="bold">[p]</tspan><tspan fill="#cdd6f4"> Prev   </tspan><tspan fill="#6c7086" font-weight="bold">[q]</tspan><tspan fill="#cdd6f4"> Quit</tspan></text>
</svg>
