id: "01-hjkl"
track: "basics"
order: 1
est_seconds: 45
title: "Home Row Navigation: h, j, k, l"
summary: "Navigate text effortlessly without moving your right hand from the home row."
keys:
  - key: "h"
    desc: "Move cursor left"
  - key: "j"
    desc: "Move cursor down (think of arrow pointing down)"
  - key: "k"
    desc: "Move cursor up"
  - key: "l"
    desc: "Move cursor right"
body: |
  Arrow keys require moving your hand off the touch-typing home row.
  In Vim's Normal mode, your right fingers rest directly over h, j, k, and l.

    h: Left    (index finger shifts left)
    j: Down    (index finger rests here; looks like a down arrow)
    k: Up      (middle finger)
    l: Right   (ring finger)

  Numbers can precede any motion as a count. For example:
    3j  = jump down 3 lines
    5l  = jump right 5 characters
drill: |
  Start on the word 'START' below and navigate using only h, j, k, l.
  Do not use the arrow keys!

  Line 1: [START] ------> navigate right using 'l'
  Line 2: | (drop down with 'j')
  Line 3: |
  Line 4: v (reach here with 'j') <------ navigate back left using 'h'
  Line 5: [GOAL REACHED]
instructions: |
  1. Position your cursor on '[START]'.
  2. Press 'l' repeatedly (or '12l') to reach the right end of Line 1.
  3. Press 'j' three times to move down to Line 4.
  4. Press 'h' repeatedly to navigate to '[GOAL REACHED]' on Line 5.
solution: |
  From [START]:
  1. Press '16l' to traverse right.
  2. Press '3j' to move down to Line 4.
  3. Press 'j' then '0' or 'h' to land on '[GOAL REACHED]'.
